espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation-testing" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito-android" }


[bundles]
# Compose UI — add all to implementation at once
compose-ui = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-material"
]

# Lifecycle
lifecycle = [
    "lifecycle-viewmodel-ktx",
    "lifecycle-runtime-ktx",
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose"
]

# Coroutines
coroutines = [
    "coroutines-core",
    "coroutines-android",
    "coroutines-guava"
]

# Retrofit + OkHttp + Moshi
networking = [
    "retrofit",
    "retrofit-converter-moshi",
    "moshi-kotlin",
    "okhttp",
    "okhttp-logging-interceptor"
]

# Room
room = [
    "room-runtime",
    "room-ktx",
    "sqlcipher-android",
    "sqlite",
    "sqlite-ktx"
]

# CameraX
camerax = [
    "camera-core",
    "camera-camera2",
    "camera-lifecycle",
    "camera-view"
]

# TFLite
tensorflow = [
    "tensorflow-lite",
    "tensorflow-lite-gpu",
    "tensorflow-lite-gpu-api",
    "tensorflow-lite-support"
]

# BouncyCastle TLS
bouncycastle = [
    "bouncycastle-provider",
    "bouncycastle-pkix"
]

# Unit test
test-unit = [
    "junit",
    "coroutines-test",
    "mockito-core",
    "mockito-kotlin",
    "mockk",
    "turbine"
]

# Android instrumented test
test-android = [
    "androidx-junit",
    "espresso-core",
    "navigation-testing",
    "mockito-android",
    "mockito-kotlin"
]


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serialization-plugin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
