# Android caller. Pushes and PRs to main run checks only. Tags containing
# "build" also build the APK and AAB. Tags also containing "release" ship.
#
# 1. extract-version: reads versionName and the Java version from app/build.gradle.kts.
# 2. ci: shared checks (lint, security, dead code, tests with coverage), plus the build on tags.
# 3. cd: release tags only. Signs and publishes through the shared release.yml.

name: "Android CI + CD (Calling Repo)"

on:
  push:
    branches:
      - main
    tags:
      - '*build*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  extract-version:
    name: Extract App Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      java_version: ${{ steps.java-version.outputs.java_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versionName from build.gradle
        id: version
        run: |
          version_string=$(grep versionName app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

      - name: Extract Java version from build.gradle.kts
        id: java-version
        run: |
          java_version=$(grep sourceCompatibility app/build.gradle.kts | head -1 | sed -E 's/.*VERSION_([0-9]+).*/\1/')
          echo "java_version=${java_version}" >> $GITHUB_OUTPUT
          echo "Extracted Java version: ${java_version}"


  ci:
    uses: Rite-Technologies-23/ops-rite-android-pipeline/.github/workflows/push.yml@main
    needs: extract-version
    with:
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: ${{ (contains(github.ref_name, 'release') && 'Release') || 'Debug' }}
      coverage_threshold: "30.00"
      runner: ubuntu-latest

      run_tests: true
      run_coverage: true
      run_static_analysis: true
      run_build: ${{ startsWith(github.ref, 'refs/tags/') }}

      coverage_branch_threshold: "0"

      run_formatting: true
      formatting_ratchet_from: "origin/main"

      run_android_lint: true
      lint_check_all_warnings: false

      run_dead_code: true
      run_deep_dead_code: true

      run_security: true
      run_dependency_audit: true
      cyclonedx_skip_projects: "hl7Core"

      kotlin_warnings_as_errors: false
      kotlin_jsr305_strict: true

      fail_on_lint: false
      fail_on_formatting: false
      fail_on_android_lint: false
      fail_on_security: false
      fail_on_vulnerabilities: false
      fail_on_dead_code: false
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}


  cd:
    uses: Rite-Technologies-23/ops-rite-android-pipeline/.github/workflows/release.yml@main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release')
    needs: [ extract-version, ci ]
    with:
      version: ${{ needs.extract-version.outputs.version }}
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: "Release"
      coverage_threshold: "30.00"

      runner: ubuntu-latest

      sign_build: true

      deploy_to_playstore: false
      package_name: "com.rite.pillcounting"
      playstore_track: internal
      playstore_status: draft

      deploy_to_esper: false
      esper_org_id: ""
      esper_app_id: ""

      enable_whats_new: false
      whats_new_file: ""

    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
      ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
