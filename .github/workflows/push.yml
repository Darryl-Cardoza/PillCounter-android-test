# Android caller. Pushes and PRs to main run checks only. Tags containing
# "build" also build the APK and AAB. Tags also containing "release" ship.
# Tag naming: a release tag must contain BOTH "build" and "release",
# e.g. v1.0.0-build-release.
#
# 1. extract-version: reads versionName and the Java version from app/build.gradle.kts.
# 2. ci: shared checks (lint, security, dead code, tests with coverage), plus the build on tags.
# 3. cd: release tags only. Signs and publishes through the shared release.yml.

name: "Android CI + CD (Calling Repo)"

on:
  push:
    branches:
      - main
    tags:
      - '*build*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # Must be GitHub-hosted: a job aimed at an offline self-hosted runner queues forever.
  select_runner:
    name: Select Runner
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        # Repo endpoint: also lists org runners, but only those this repo is allowed to use.
        # Never fails the run: every problem falls back to ubuntu-latest with a warning.
        # Fork PRs stay on GitHub-hosted so untrusted code never runs on the self-hosted machine.
        run: |
          linux=ubuntu-latest
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::Fork PR, using ubuntu-latest"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::RUNNER_STATUS_TOKEN is not set, using ubuntu-latest"
          elif ! online=$(gh api --paginate "repos/$REPO/actions/runners" \
              --jq '.runners[] | select(.status=="online" and .busy==false) | .labels[].name'); then
            echo "::warning::Runner API call failed (check RUNNER_STATUS_TOKEN), using ubuntu-latest"
          elif grep -qix rite-ubuntu <<<"$online"; then
            linux=rite-ubuntu
          else
            echo "::warning::No idle online rite-ubuntu runner, using ubuntu-latest"
          fi
          echo "linux=$linux" | tee -a "$GITHUB_OUTPUT"

  extract-version:
    name: Extract App Version
    needs: select_runner
    runs-on: ${{ needs.select_runner.outputs.linux }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      java_version: ${{ steps.java-version.outputs.java_version }}
      # Release tag push only. A plain push to main also triggers this workflow, so cd and
      # upload-mapping must not run for it.
      is_release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versionName from build.gradle
        id: version
        run: |
          # Assumes versionName "1.0.0"
          version_string=$(grep -E '^\s*versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

      - name: Extract Java version from build.gradle.kts
        id: java-version
        run: |
          # Assumes sourceCompatibility = JavaVersion.VERSION_17
          java_version=$(grep sourceCompatibility app/build.gradle.kts | head -1 | sed -E 's/.*VERSION_([0-9]+).*/\1/')
          echo "java_version=${java_version}" >> $GITHUB_OUTPUT
          echo "Extracted Java version: ${java_version}"

  # CI for PRs and branch pushes. Builds Release directly (once) for a
  # release-tag push instead of Debug, so the `cd` job below doesn't need its
  # own nested CI/build pass -- _release.yml no
  # longer runs one; it just downloads and signs whatever this job built.
  ci:
    uses: ./.github/workflows/_ci.yml
    needs: [select_runner, extract-version]
    with:
      # ---- core ----
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: ${{ (contains(github.ref_name, 'release') && 'Release') || 'Debug' }}
      # Keep equal to cd's threshold, or a release tag fails ci before cd runs.
      coverage_threshold: "30.00"
      runner: ${{ needs.select_runner.outputs.linux }}

      run_tests: true
      run_coverage: true
      run_static_analysis: false
      # Checks only on a PR or a plain push to main -- no APK/AAB assembled.
      # Only a tag push builds, since that's the only case `cd` below needs
      # an artifact to sign and ship.
      run_build: ${{ startsWith(github.ref, 'refs/tags/') }}

      # ---- coverage ----
      coverage_branch_threshold: "0"   # 0 disables the branch gate

      # ---- formatting ----
      run_formatting: true
      formatting_ratchet_from: "origin/main"

      # ---- android lint ----
      run_android_lint: true
      lint_check_all_warnings: false

      # ---- dead code ----
      # DAGP is declared directly for the whole build (root build.gradle.kts).
      # Report-only for now; flip fail_on_dead_code once buildHealth findings
      # are triaged.
      run_dead_code: true
      run_deep_dead_code: true

      # ---- security ----
      run_security: true
      run_dependency_audit: true
      cyclonedx_skip_projects: ""

      # ---- static typing strictness ----
      kotlin_warnings_as_errors: false
      kotlin_jsr305_strict: true

      # ---- gates ----
      fail_on_lint: false
      fail_on_formatting: false        # warn only while adopting Spotless
      fail_on_android_lint: false
      fail_on_security: false
      fail_on_vulnerabilities: false
      fail_on_dead_code: false

  # CD for version tags. Only fires when the tag also contains "release", the
  # same condition `ci` above uses to pick build_variant -- so `ci` has
  # already built Release for this exact push, and `cd` just downloads,
  # signs and ships that artifact (release.yml runs no CI/build of its own).
  #
  # Tag naming: the push trigger only matches tags containing "build", so a
  # release tag must contain BOTH words to reach this job, e.g.
  # v1.0.0-build-release. The is_release output (set in extract-version) guards
  # this job: a plain push to main also fires this workflow and must not run cd.
  cd:
    uses: ./.github/workflows/_release.yml
    if: needs.extract-version.outputs.is_release == 'true'
    needs: [ select_runner, extract-version, ci ]
    with:
      version: ${{ needs.extract-version.outputs.version }}
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: "Release"
      # Keep equal to ci's threshold, or a release tag fails ci before cd runs.
      coverage_threshold: "30.00"

      runner: ${{ needs.select_runner.outputs.linux }}

      deploy_to_playstore: false
      package_name: "com.dispensesure.retail"
      playstore_track: internal
      playstore_status: draft

      sign_build: true   # false = attach unsigned APK/AAB to the GitHub Release

      deploy_to_esper: false
      esper_org_id: ""
      esper_app_id: ""

      enable_whats_new: false
      whats_new_file: ""

    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
      ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}

  # Uploads the R8 mapping to the observability vendor. Runs here (not in _release.yml)
  # so the key stays in this job, and only after ci + cd succeeded for the
  # release tag. The version id derives from the commit SHA, so it matches the shipped build.
  upload-mapping:
    if: needs.extract-version.outputs.is_release == 'true'
    needs: [ select_runner, extract-version, ci, cd ]
    runs-on: ${{ needs.select_runner.outputs.linux }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.extract-version.outputs.java_version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        # The plugin generates the build id while packaging, and the upload fails without it.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Download shipped build
        uses: actions/download-artifact@v4
        with:
          name: android-build-outputs-Release
          path: shipped
      - name: Use the shipped AAB's mapping
        # R8 output is not reproducible across runs (pg_map_id/hash differ on rebuild), so
        # overwrite the rebuilt mapping with the one embedded in the shipped AAB.
        # The upload then matches what users run by construction.
        run: |
          AAB=$(find shipped -name '*.aab' | head -n1)
          [ -n "$AAB" ] || { echo "::error::No AAB in android-build-outputs-Release"; exit 1; }
          unzip -p "$AAB" BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map > shipped-mapping.txt
          grep -q -m1 -E '^# pg_map_id:' shipped-mapping.txt || { echo "::error::No pg_map_id in shipped AAB mapping"; exit 1; }
          cp shipped-mapping.txt app/build/outputs/mapping/release/mapping.txt
          grep -m2 -E '^# pg_map_(id|hash):' shipped-mapping.txt
      - name: Upload R8 mapping
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: ./gradlew :app:uploadMappingRelease --no-daemon --stacktrace
