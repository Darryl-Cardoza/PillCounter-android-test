# Android caller. Pushes and PRs to main run checks only. Tags containing
# "build" also build the APK and AAB. Tags also containing "release" ship.
#
# 1. extract-version: reads versionName and the Java version from app/build.gradle.kts.
# 2. ci: shared checks (lint, security, dead code, tests with coverage), plus the build on tags.
# 3. cd: release tags only. Signs and publishes through the shared release.yml.

name: "Android CI + CD (Calling Repo)"

on:
  push:
    branches:
      - main
    tags:
      - '*build*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # Must be GitHub-hosted: a job aimed at an offline self-hosted runner queues forever.
  select_runner:
    name: Select Runner
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          online=$( [ -n "$GH_TOKEN" ] && gh api --paginate "orgs/${{ github.repository_owner }}/actions/runners" \
            --jq '.runners[] | select(.status=="online") | .labels[].name' 2>/dev/null || true)
          pick() { grep -qix "$2" <<<"$online" && echo "$1=$2" || echo "$1=$3"; }
          pick linux rite-ubuntu ubuntu-latest | tee -a "$GITHUB_OUTPUT"

  extract-version:
    name: Extract App Version
    needs: select_runner
    runs-on: ${{ needs.select_runner.outputs.linux }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      java_version: ${{ steps.java-version.outputs.java_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract versionName from build.gradle
        id: version
        run: |
          # Assumes versionName "1.0.0"
          version_string=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${version_string}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${version_string}"

      - name: Extract Java version from build.gradle.kts
        id: java-version
        run: |
          java_version=$(grep sourceCompatibility app/build.gradle.kts | head -1 | sed -E 's/.*VERSION_([0-9]+).*/\1/')
          echo "java_version=${java_version}" >> $GITHUB_OUTPUT
          echo "Extracted Java version: ${java_version}"


  ci:
    uses: Rite-Technologies-23/ops-rite-android-pipeline/.github/workflows/push.yml@main
    needs: [select_runner, extract-version]
    with:
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: ${{ (contains(github.ref_name, 'release') && 'Release') || 'Debug' }}
      coverage_threshold: "30.00"
      runner: ${{ needs.select_runner.outputs.linux }}

      run_tests: true
      run_coverage: true
      run_static_analysis: false
      # Checks only on a PR or a plain push to main -- no APK/AAB assembled.
      # Only a tag push builds, since that's the only case `cd` below needs
      # an artifact to sign and ship.
      run_build: ${{ startsWith(github.ref, 'refs/tags/') }}

      coverage_branch_threshold: "0"

      run_formatting: true
      formatting_ratchet_from: "origin/main"

      run_android_lint: true
      lint_check_all_warnings: false

      # ---- dead code ----
      # DAGP is declared directly for the whole build (root build.gradle.kts).
      # Report-only for now; flip fail_on_dead_code once buildHealth findings
      # are triaged.
      run_dead_code: true
      run_deep_dead_code: true

      run_security: true
      run_dependency_audit: true
      cyclonedx_skip_projects: ""

      kotlin_warnings_as_errors: false
      kotlin_jsr305_strict: true

      fail_on_lint: false
      fail_on_formatting: false
      fail_on_android_lint: false
      fail_on_security: false
      fail_on_vulnerabilities: false
      fail_on_dead_code: false
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}


  cd:
    uses: Rite-Technologies-23/ops-rite-android-pipeline/.github/workflows/release.yml@main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release')
    needs: [ select_runner, extract-version, ci ]
    with:
      version: ${{ needs.extract-version.outputs.version }}
      java_version: ${{ needs.extract-version.outputs.java_version }}
      build_variant: "Release"
      coverage_threshold: "30.00"

      runner: ${{ needs.select_runner.outputs.linux }}

      sign_build: true

      deploy_to_playstore: false
      package_name: "com.dispensesure.retail"
      playstore_track: internal
      playstore_status: draft

      sign_build: true   # false = attach unsigned APK/AAB to the GitHub Release

      deploy_to_esper: false
      esper_org_id: ""
      esper_app_id: ""

      enable_whats_new: false
      whats_new_file: ""

    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      PLAYSTORE_SERVICE_ACCOUNT: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
      ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}

  # Uploads the R8 mapping to the observability vendor. Runs here (not in the reusable
  # pipeline) so the key stays in this repo, and only after ci + cd succeeded for the
  # release tag. The version id derives from the commit SHA, so it matches the shipped build.
  upload-mapping:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'release')
    needs: [ select_runner, extract-version, ci, cd ]
    runs-on: ${{ needs.select_runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.extract-version.outputs.java_version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release
        # The plugin generates the build id while packaging, and the upload fails without it.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Download shipped build
        uses: actions/download-artifact@v4
        with:
          name: android-build-outputs-Release
          path: shipped
      - name: Verify mapping matches shipped AAB
        # Datadog pairs mapping to app by version name, not content; compare the R8 ids so a toolchain mismatch fails here.
        run: |
          ids() { grep -m2 -E '^# pg_map_(id|hash):'; }
          AAB=$(find shipped -name '*.aab' | head -n1)
          [ -n "$AAB" ] || { echo "::error::No AAB in android-build-outputs-Release"; exit 1; }
          SHIPPED=$({ unzip -p "$AAB" BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map || true; } | ids)
          BUILT=$(ids < app/build/outputs/mapping/release/mapping.txt)
          [ -n "$SHIPPED" ] || { echo "::error::No pg_map_id in shipped AAB"; exit 1; }
          [ "$SHIPPED" = "$BUILT" ] || { echo "::error::Mapping does not match shipped AAB"; echo "shipped: $SHIPPED"; echo "built:   $BUILT"; exit 1; }
          echo "Mapping matches shipped AAB: $BUILT"
      - name: Upload R8 mapping
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: ./gradlew :app:uploadMappingRelease --no-daemon --stacktrace
